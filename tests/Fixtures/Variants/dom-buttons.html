<!DOCTYPE html>
<html lang="en">
<head>
    <title>Example Running Shoe</title>
</head>
<body>
    <h1>Example Running Shoe</h1>
    <div class="size-selector">
        <button class="size" data-size="UK 8" data-sku="SHOE-8">UK 8 <span class="hint">Only 2 left</span></button>
        <button class="size" data-size="UK 9" data-sku="SHOE-9" disabled>UK 9</button>
        <button class="size is-sold-out" data-size="UK 10" data-sku="SHOE-10">UK 10</button>
        <button class="size" data-size="UK 11" data-sku="SHOE-11" aria-disabled="false">UK 11</button>
    </div>
</body>
</html>
